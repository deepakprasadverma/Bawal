<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bawal Mode</title>
<style>
  :root{
    --bg:#05050a; --fg:#e8e8ff; --accent:#ff2fd4;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  html,body{height:100%; margin:0; overflow:hidden; background:var(--bg);}
  body{font-family:'Courier New',monospace; color:var(--fg);}
  canvas{position:fixed; top:0; left:0; width:100%; height:100%; display:block;}
  #ui{
    position:fixed; top:env(safe-area-inset-top,10px); left:50%; transform:translateX(-50%);
    z-index:10; text-align:center; pointer-events:none;
    text-shadow:0 0 10px var(--accent), 0 0 20px var(--accent);
  }
  #ui h1{font-size:1.1rem; margin:6px 0; letter-spacing:2px; font-weight:900;}
  #ui p{font-size:0.75rem; margin:0; opacity:0.7;}
  #controls{
    position:fixed; bottom:env(safe-area-inset-bottom,14px); left:50%; transform:translateX(-50%);
    z-index:10; display:flex; gap:10px;
  }
  button{
    background:rgba(255,47,212,0.12); border:1px solid var(--accent); color:var(--fg);
    padding:8px 14px; border-radius:20px; font-family:inherit; font-size:0.75rem;
    cursor:pointer; backdrop-filter:blur(4px);
  }
  button:active{background:var(--accent); color:#05050a;}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="fx"></canvas>
<div id="ui">
  <h1>⚡ BAWAL MODE ⚡</h1>
  <p>tap/click anywhere → dhamaka</p>
</div>
<div id="controls">
  <button id="boom">🎆 Auto Boom</button>
  <button id="clear">🧹 Clear</button>
</div>

<script>
// ---------- Matrix rain (background) ----------
const rainCv = document.getElementById('rain');
const rctx = rainCv.getContext('2d');
let W, H, cols, drops;
const chars = "アイウエオカキクケコサシスセソタチツテトナニ0123456789ॐधर्मशांतिकर्मयोग";

function resize(){
  W = rainCv.width = window.innerWidth;
  H = rainCv.height = window.innerHeight;
  fxCv.width = W; fxCv.height = H;
  cols = Math.floor(W/16);
  drops = new Array(cols).fill(1);
}

function drawRain(){
  rctx.fillStyle = "rgba(5,5,10,0.08)";
  rctx.fillRect(0,0,W,H);
  rctx.fillStyle = "#0aff8c";
  rctx.font = "14px monospace";
  for(let i=0;i<drops.length;i++){
    const t = chars[Math.floor(Math.random()*chars.length)];
    rctx.fillText(t, i*16, drops[i]*16);
    if(drops[i]*16 > H && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}

// ---------- Fireworks / particles ----------
const fxCv = document.getElementById('fx');
const fctx = fxCv.getContext('2d');
let particles = [];

function rand(a,b){ return a + Math.random()*(b-a); }
function hsl(h){ return `hsl(${h},100%,60%)`; }

function burst(x,y){
  const hue = Math.floor(rand(0,360));
  const n = 60;
  for(let i=0;i<n;i++){
    const angle = (Math.PI*2*i)/n + rand(-0.1,0.1);
    const speed = rand(2,9);
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1,
      decay: rand(0.008,0.02),
      hue: hue + rand(-20,20),
      size: rand(1.5,3.5)
    });
  }
}

function updateParticles(){
  fctx.clearRect(0,0,W,H);
  particles.forEach(p=>{
    p.vy += 0.06; // gravity
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    fctx.globalAlpha = Math.max(p.life,0);
    fctx.fillStyle = hsl(p.hue);
    fctx.shadowBlur = 12;
    fctx.shadowColor = hsl(p.hue);
    fctx.beginPath();
    fctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    fctx.fill();
  });
  fctx.globalAlpha = 1;
  particles = particles.filter(p=>p.life > 0);
}

function loop(){
  drawRain();
  updateParticles();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
loop();

function fireAt(e){
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  burst(x,y);
}
window.addEventListener('click', fireAt);
window.addEventListener('touchstart', (e)=>{ fireAt(e); }, {passive:true});

let autoTimer = null;
document.getElementById('boom').onclick = ()=>{
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; return; }
  autoTimer = setInterval(()=>{
    burst(rand(W*0.15,W*0.85), rand(H*0.15,H*0.6));
  }, 450);
};
document.getElementById('clear').onclick = ()=>{ particles = []; };

// initial welcome bursts
setTimeout(()=>burst(W*0.3,H*0.35),300);
setTimeout(()=>burst(W*0.7,H*0.4),600);
setTimeout(()=>burst(W*0.5,H*0.25),900);
</script>
</body>
</html>
